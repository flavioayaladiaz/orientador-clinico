<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orientador Clínico</title>
<meta name="description" content="Orientador Clínico: checklists, algoritmos y guías de orientación para la urgencia. Funciona sin conexión.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./nav.css">
<script src="./tema.js"></script>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>Orientador <span>Clínico</span></h1>
  </div>

  <div class="statusbar">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar entre modo claro y modo oscuro">◐</button>
    <span class="theme-label">Cambiar a modo claro / oscuro</span>
    <button id="installBtn" type="button">⤓ Instalar app</button>
  </div>

  <div class="search" role="search">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="Buscar: disnea, pericardiocentesis, sepsis…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar en el Orientador Clínico">
  </div>

  <div id="out" aria-live="polite"></div>

  <div class="note">
    <strong>Uso clínico.</strong> Orientador Clínico es una ayuda memoria de apoyo a la atención de urgencia: no reemplaza el juicio clínico. Verifica dosis y contraindicaciones antes de indicar cualquier fármaco.
  </div>

  <footer>
    <span>Orientador Clínico</span>
    <span id="lastUpdate"></span>
  </footer>

</div>

<script src="./catalogo.js"></script>
<script src="./nav.js"></script>
<script>
  (function () {
    var OC = window.OC, C = OC.C;
    var out = document.getElementById('out'), q = document.getElementById('q');

    function areasHTML() {
      var h = '<div class="areas">';
      C.areas.forEach(function (a, i) {
        h += '<a class="area" href="./area.html?a=' + OC.esc(a.id) + '" style="--accent:var(--' + OC.esc(a.color) +
          '); animation-delay:' + (0.1 + i * 0.06).toFixed(2) + 's;"><div class="area-inner"><div class="area-main">' +
          '<div class="area-title">' + OC.esc(a.nombre) + '</div></div></div></a>';
      });
      return h + '</div>';
    }

    function render() {
      var term = q.value.trim();
      if (!term) { out.innerHTML = areasHTML(); return; }
      var res = OC.buscar(term);
      if (!res.length) {
        out.innerHTML = '<div class="empty">Sin resultados para «' + OC.esc(term) +
          '». Prueba con el síntoma, el diagnóstico o el nombre del procedimiento.</div>';
        return;
      }
      out.innerHTML = '<div class="search-count">' + res.length + (res.length === 1 ? ' resultado' : ' resultados') +
        '</div><div class="cards">' +
        res.map(function (p, i) { return OC.cardHTML(p, i, { crumb: OC.miga(p) }); }).join('') + '</div>';
    }

    q.addEventListener('input', render);
    render();
  })();
</script>
</body>
</html>
